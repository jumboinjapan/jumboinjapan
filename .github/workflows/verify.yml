name: verify

# Ворота репозитория. После установки зависимостей workflow выполняет ТЕ ЖЕ
# стадии и В ТОМ ЖЕ ПОРЯДКЕ, что и локальный `npm run verify`. Одной командой
# `npm run verify` он их не запускает: отдельные шаги дают отдельные строки в
# логе и понятную первую упавшую стадию. Равенство состава и порядка стережёт
# `npm run check:docs` — он читает и package.json, и этот файл.
#
# Ключей у CI нет, поэтому живые Airtable-проверки пропускают свою часть и
# говорят об этом вслух. Пропуск без ключей — штатный режим. Если ключи
# заданы, а сеть недоступна, это настоящий отказ проверки, а не пропуск.
#
# `npm ci`, а не `npm install`: он падает при рассинхроне package-lock.json
# с package.json. Именно так эта рассинхронизация и прожила незамеченной до
# 2026-08-09 — локально всех спасал `npm install`, молча переписывавший лок.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Типы
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Типографика
        run: npm run check:typography

      # Сверяет документацию с кодом: состав и порядок стадий verify против
      # этого файла, полноту .env.example и флаги коллектора POI. Без сети.
      - name: Контракты документации
        run: npm run check:docs

      - name: Длина текстов
        run: npm run check:copy

      # Без ключей живые запросы к Airtable не выполняются: проверка печатает
      # пропуск и завершается нулём.
      - name: Каноны текста
        run: npm run check:canon

      # Без ключей сверяется по снимку tests/fixtures/poi-names.json — это
      # тест на регрессию транслитератора, а не на доступ к базе.
      - name: Поливанов
        run: npm run check:polivanov

      - name: Целостность POI
        run: npm run check:poi

      - name: Токены админки
        run: npm run check:admin-tokens

      - name: Ссылки на изображения
        run: npm run check:images

      - name: Сборка без переменных окружения
        run: npm run build
